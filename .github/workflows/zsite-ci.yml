name: ZSite CI

on:
  push:
    branches: ["main"]
    paths:
      - "hepra-saas/**"
      - ".github/workflows/zsite-ci.yml"
  pull_request:
    paths:
      - "hepra-saas/**"
      - ".github/workflows/zsite-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hepra-saas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hepra-saas/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
